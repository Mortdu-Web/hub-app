<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { --bg:#f7f3ec; --surface:#fff; --line:#e3dccf; --muted:#7a7066; --accent:#2b2118; --gold:#b8893b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--accent); font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap;
             background:var(--surface); border-bottom:1px solid var(--line); padding:.85rem 1.5rem; }
    header .who { color:var(--muted); font-size:.9rem; }
    header a { color:var(--gold); text-decoration:none; margin-left:1rem; }
    main { max-width:1040px; margin:0 auto; padding:56px 24px 80px; }
    h1 { font-weight:300; font-size:clamp(2rem,5vw,3.2rem); line-height:1.1; margin:0 0 32px; }
    .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
    .card { display:block; padding:24px; background:var(--surface); border:1px solid var(--line);
            color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
    .card:hover, .card:focus-visible { border-color:var(--gold); transform:translateY(-2px); outline:none; }
    .icon { font-size:2rem; line-height:1; }
    .card h2 { margin:12px 0 4px; font-size:1.2rem; }
    .card p { margin:0; color:var(--muted); font-size:.9rem; }
    .empty { color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <span class="who">Connecté en tant que <strong>{{ user.username }}</strong></span>
    <a href="{{ logout_url }}">Se déconnecter</a>
  </header>
  <main>
    <h1>{{ title }}</h1>
    {% if apps %}
    <div class="grid">
      {% for app in apps %}
      <a class="card" href="{{ app.url }}" rel="noopener">
        <div class="icon" aria-hidden="true">{{ app.icon }}</div>
        <h2>{{ app.name }}</h2>
        {% if app.description %}<p>{{ app.description }}</p>{% endif %}
      </a>
      {% endfor %}
    </div>
    {% else %}
    <p class="empty">Aucune application disponible pour ce compte.</p>
    {% endif %}
  </main>
</body>
</html>
